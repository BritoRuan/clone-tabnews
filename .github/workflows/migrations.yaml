name: Execute Migrations on Production

on:
  push:
    branches:
      - main

jobs:
  migrations:
    name: Compile and Run Migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/hydrogen"
          cache: npm

      - run: npm ci

      - name: Build migrations (TypeScript → JavaScript)
        run: npm run migrations:build:migrations

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          if ! npx node-pg-migrate -m dist/infra/migrations up >/dev/null 2>&1; then
            echo "Failed to run migrations. Check database connectivity and credentials."
            exit 1
          fi
